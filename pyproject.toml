[project]
name = "gitmaps"
version = "0.1.0"
description = "AI-powered GitHub intelligence platform — collector worker."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
packages = ["gitmaps"]
warn_unused_configs = true
